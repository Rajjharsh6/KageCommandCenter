name: Build KAGE APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and required components
      uses: android-actions/setup-android@v3
      with:
        api-levels: 35
        build-tools: 35.0.0
        components: |
          platform-tools
          "cmdline-tools;latest"

    - name: Accept Android SDK licenses
      run: |
        # ensure ANDROID_SDK_ROOT is defined and use cmdline-tools from the SDK root
        export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Install Android 35 Platform and Build-Tools (ensures components present)
      run: |
        export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

    - name: Validate or Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.9
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScheduleReminder-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk